[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aioffice-modules"
version = "0.1.0"
description = "AIOffice Gate 1 Python module foundations"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116,<1.0",
  "pydantic>=2.11,<3.0"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2.0",
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
